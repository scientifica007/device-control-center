name: Test and build Debian package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m compileall -q app tests
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Install GTK3 smoke-test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 xvfb xauth
      - name: Test application startup with Xvfb
        run: xvfb-run -a /usr/bin/python3 tests/gtk_smoke.py
      - name: Build .deb
        run: bash packaging/build_deb.sh
      - name: Inspect package
        run: dpkg-deb --info dist/device-control-center_0.1.2_all.deb
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: device-control-center-deb
          path: dist/device-control-center_0.1.2_all.deb
